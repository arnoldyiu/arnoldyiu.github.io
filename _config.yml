title: Arnold Yiu
description: The personal website and portfolio of Arnold Yiu.

# Pinned to the 0.4.9 release commit; later commits require the jektex plugin,
# which GitHub Pages does not provide.
remote_theme: riggraz/no-style-please@5a4c17e3a9c04a84804c9050f24abb528b0e8164

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: true # show site description in home page
  lowercase_titles: true # show titles in lowercase in lists

sass:
  style: compressed

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
